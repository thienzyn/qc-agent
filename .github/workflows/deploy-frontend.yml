name: Deploy Frontend to GreenNode

on:
  push:
    branches:
      - main
    paths:
      - 'qc-chat-ui/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qc-chat-ui/package-lock.json

      - name: Install dependencies
        working-directory: qc-chat-ui
        run: npm ci

      - name: Build frontend
        working-directory: qc-chat-ui
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GreenNode Container Registry
        run: |
          # Lấy access token từ IAM
          ACCESS_TOKEN=$(curl -s -X POST \
            "https://iam.api.vngcloud.vn/accounts-api/v2/auth/token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.GREENNODE_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.GREENNODE_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

          # Lấy registry URL
          REGISTRY_URL=$(curl -s -X GET \
            "https://agentbase.api.vngcloud.vn/cr/api/v1/repository" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            | jq -r '.registryUrl')

          echo "REGISTRY_URL=$REGISTRY_URL" >> $GITHUB_ENV

          # Lấy registry credentials
          CREDS=$(curl -s -X GET \
            "https://agentbase.api.vngcloud.vn/cr/api/v1/registry-credential" \
            -H "Authorization: Bearer $ACCESS_TOKEN")

          CR_USER=$(echo $CREDS | jq -r '.username')
          CR_SECRET=$(echo $CREDS | jq -r '.secret')

          # Docker login
          echo "$CR_SECRET" | docker login "$REGISTRY_URL" \
            -u "$CR_USER" \
            --password-stdin

      - name: Build and push Docker image
        working-directory: qc-chat-ui
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY_URL }}/111480-abp112032/qc-chat-ui:latest \
            -f Dockerfile .
          docker push ${{ env.REGISTRY_URL }}/111480-abp112032/qc-chat-ui:latest

      - name: Update GreenNode Runtime
        run: |
          curl -s -X PUT \
            "https://agentbase.api.vngcloud.vn/runtime/api/v1/runtimes/runtime-fc611d2e-74f0-4921-abfc-f2e204d6b75f" \
            -H "Authorization: Bearer ${{ env.ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${{ env.REGISTRY_URL }}/111480-abp112032/qc-chat-ui:latest\"}"

      - name: Done
        run: echo "✅ Frontend deployed successfully!"
